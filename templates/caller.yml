name: Release and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  deploy:
    uses: beirern/django-deploy/.github/workflows/deploy.yml@v1.0.0
    with:
      deploy-directory: /home/ubuntu/my-app
      compose-files: |
        docker-compose.yml
      deployment-files: |
        docker-compose.yml
      # Flight-AI can add docker-compose.prod.yml and its Chroma config above.
      # Add BUILD_ENV=production below if the Dockerfile needs it.
      build-args: ''
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
      APP_ENV: ${{ secrets.APP_ENV }}
